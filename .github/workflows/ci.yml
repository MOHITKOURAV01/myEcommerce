name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - name: Lint Server
        run: cd server && npm ci && npx eslint . --ext .js --max-warnings 50
      - name: Lint Client
        run: cd client && npm ci && npx eslint . --max-warnings 100

  test-server:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports: ['27017:27017']
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      NODE_ENV: test
      MONGO_URI: mongodb://localhost:27017/booksmart_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci_test_secret_key
      JWT_REFRESH_SECRET: ci_refresh_secret
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - name: Install Dependencies
        run: cd server && npm ci
      - name: Run Unit Tests
        run: cd server && npm run test:unit -- --coverage
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          directory: server/coverage

  build-client:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - name: Build
        run: cd client && npm ci && npm run build
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-build
          path: client/dist
