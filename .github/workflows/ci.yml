name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - name: Lint Server
        run: cd server && npm ci && npm run lint
      - name: Lint Client
        run: cd client && npm ci && npm run lint

  test-server:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports: [27017:27017]
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
    env:
      NODE_ENV: test
      MONGO_URI: mongodb://localhost:27017/booksmart_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci_test_secret_key
      JWT_REFRESH_SECRET: ci_refresh_secret
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - name: Run Tests
        run: |
          cd server
          npm ci
          npm run test:unit -- --coverage
          npm run test:integration
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          directory: server/coverage

  build-client:
    runs-on: ubuntu-latest
    needs: [lint, test-server]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - name: Build
        run: cd client && npm ci && npm run build
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-build
          path: client/dist

  e2e:
    runs-on: ubuntu-latest
    needs: [build-client]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Server
        run: cd server && npm ci
      - name: Start Server
        run: |
          cd server
          npm start &
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://localhost:27017/booksmart_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci_test_secret_key
      - name: Serve Client
        run: npx serve -s client/dist -l 5173 &
      - name: Wait for services
        run: npx wait-on http://localhost:5173 http://localhost:5000/health
      - name: Run Cypress
        uses: cypress-io/github-action@v6
        with:
          working-directory: e2e
