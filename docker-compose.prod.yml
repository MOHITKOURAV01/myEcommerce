version: '3.8'

services:
  # MongoDB (Production)
  mongo:
    image: mongo:7
    container_name: booksmart-mongo-prod
    ports:
      - "27017:27017"
    volumes:
      - mongo_prod_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: booksmart
    restart: always

  # Redis (Production)
  redis:
    image: redis:7-alpine
    container_name: booksmart-redis-prod
    ports:
      - "6379:6379"
    restart: always

  # Server (Production)
  server:
    build: 
      context: ./server
      dockerfile: Dockerfile
    container_name: booksmart-api-prod
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/booksmart
      REDIS_URL: redis://redis:6379
    depends_on:
      - mongo
      - redis
    restart: always

  # Client (Production - served via Nginx in container)
  client:
    build: 
      context: ./client
      dockerfile: Dockerfile
    container_name: booksmart-client-prod
    ports:
      - "80:80"
    environment:
      VITE_API_URL: /api
    depends_on:
      - server
    restart: always

volumes:
  mongo_prod_data:
